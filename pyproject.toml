
[project]
authors = [
  {name = "Bruno Caneco", email = "bruno@dmpstats.com"}
]
# PEP 621 project metadata
# See https://www.python.org/dev/peps/pep-0621/
dependencies = [
    "pillow>=10.2.0,<11.0.0",
    "opencv-python>=4.8.1.78,<5.0.0",
    "tqdm>=4.66.2,<5.0.0",
    "requests>=2.31.0,<3.0.0",
    "jupyterlab>=4.5.9,<5.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "numpy>=1.24.3,<2.0.0",
    "pandas>=2.2.1,<3.0.0",
    "lxml>=5.0.0,<6.0.0",
    "tensorflow>=2.16.0,<3.0.0",
    "absl-py>=1.0.0,<2.0.0",
]
description = ""
license = "GPL-3.0+"
name = "sscd"
readme = "README.md"
requires-python = ">=3.10,<3.13"
version = "0.1.0"

[project.scripts]
sscd-fetch = "sscd_libs.fetch:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sscd_libs"]

[dependency-groups]
dev = [
    "deptry",
    "ipykernel",
]

[tool.deptry]
known_first_party = ["sscd_libs"]

[tool.ruff]
fix = true

[tool.ruff.lint]
ignore = ["COM812"]
select = ["E", "W", "I", "F", "UP", "S", "B", "A", "COM", "LOG", "PTH", "Q"]
